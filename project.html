<style>
  :root {
    --black: #080808;
    --off-white: #F0EDE8;
    --accent: #C8FF00;
    --mid: #2A2A2A;
    --grey: #888;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--off-white);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.4rem 2.5rem;
    background: rgba(8,8,8,0.88);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .nav-logo {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--off-white);
    text-decoration: none;
  }

  .nav-links { display: flex; gap: 2rem; list-style: none; }

  .nav-links a {
    font-family: var(--font-display);
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--grey);
    text-decoration: none;
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--accent); }

  /* ── HERO ── */
  .project-hero {
    padding-top: 7rem;
    padding-bottom: 0;
  }

  .hero-img {
    width: 100%;
    max-height: 70vh;
    object-fit: cover;
    display: block;
    background: var(--mid);
  }

  /* ── CONTENT WRAPPER ── */
  .content {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 2.5rem 6rem;
  }

  /* ── PROJECT HEADER ── */
  .project-header {
    padding: 3.5rem 0 3rem;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--font-display);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--grey);
    text-decoration: none;
    margin-bottom: 2rem;
    transition: color 0.2s;
  }

  .back-link:hover { color: var(--accent); }

  .project-title {
    font-family: var(--font-display);
    font-size: clamp(2rem, 5vw, 3.8rem);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--off-white);
    margin-bottom: 1.5rem;
  }

  .project-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    align-items: center;
  }

  .tag-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }

  .tag {
    font-family: var(--font-display);
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(200,255,0,0.3);
    padding: 0.35rem 0.8rem;
  }

  .meta-item {
    font-family: var(--font-display);
    font-size: 0.75rem;
    color: var(--grey);
    letter-spacing: 0.05em;
  }

  .meta-item strong {
    color: var(--off-white);
    font-weight: 600;
  }

  /* ── SECTIONS ── */
  .section {
    padding: 3rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .section:last-child { border-bottom: none; }

  .section-eyebrow {
    font-family: var(--font-display);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1rem;
  }

  .section-heading {
    font-family: var(--font-display);
    font-size: clamp(1.3rem, 3vw, 2rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--off-white);
    margin-bottom: 1.2rem;
    line-height: 1.15;
  }

  .section-body {
    color: var(--grey);
    font-size: 1rem;
    line-height: 1.85;
    font-weight: 300;
  }

  .section-body p + p { margin-top: 1rem; }

  .section-body strong {
    color: var(--off-white);
    font-weight: 500;
  }

  /* bullet list inside sections */
  .bullet-list {
    list-style: none;
    margin-top: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }

  .bullet-list li {
    display: flex;
    gap: 0.8rem;
    color: var(--grey);
    font-size: 0.95rem;
    line-height: 1.7;
  }

  .bullet-list li::before {
    content: '—';
    color: var(--accent);
    flex-shrink: 0;
    font-weight: 600;
  }

  /* inline image */
  .section-img {
    width: 100%;
    display: block;
    margin: 2rem 0;
    background: var(--mid);
    object-fit: cover;
  }

  /* two-col image pair */
  .img-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin: 2rem 0;
  }

  .img-pair img {
    width: 100%;
    object-fit: cover;
    background: var(--mid);
  }

  /* tools row */
  .tools-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-top: 1.2rem;
  }

  .tool-chip {
    font-family: var(--font-display);
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--grey);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 0.4rem 0.9rem;
  }

  /* callout box */
  .callout {
    border-left: 3px solid var(--accent);
    padding: 1.2rem 1.5rem;
    background: rgba(200,255,0,0.04);
    margin: 2rem 0;
  }

  .callout p {
    color: var(--off-white);
    font-size: 0.95rem;
    line-height: 1.7;
    font-weight: 400;
  }

  .project-nav {
    display: flex;
    justify-content: space-between;
    align-items: stretch;
    gap: 1rem;
    padding: 3rem 0 0;
    border-top: 1px solid rgba(255,255,255,0.08);
    margin-top: 1rem;
  }

  .proj-nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    padding: 1.5rem;
    background: var(--mid);
    text-decoration: none;
    transition: background 0.2s;
    min-width: 0;
  }

  .proj-nav-btn:hover { background: #333; }

  .proj-nav-direction {
    font-family: var(--font-display);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .proj-nav-title {
    font-family: var(--font-display);
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--off-white);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  footer {
    padding: 2rem 2.5rem;
    border-top: 1px solid rgba(255,255,255,0.07);
    display: flex;
    justify-content: space-between;
    align-items: center;

    font-family: var(--font-display);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--grey);

  /* ── RESPONSIVE ── */
  @media (max-width: 700px) {

    .nav-links { gap: 1rem; }
    .content { padding: 0 1.2rem 4rem; }

    .project-nav { flex-direction: column; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }

</style>

// ── ROUTING ──
function getProjectId() {
  const params = new URLSearchParams(window.location.search);
  return params.get('p') || PROJECTS[0].id;
}

function getProjectIndex(id) {
  return PROJECTS.findIndex(p => p.id === id);
}

// ── RENDER ──
function render() {
  const id = getProjectId();
  const idx = getProjectIndex(id);
  const p = PROJECTS[idx] || PROJECTS[0];
  const prev = PROJECTS[idx - 1] || null;
  const next = PROJECTS[idx + 1] || null;

  document.title = `${p.title} — Chris Lau`;

  const sectionsHTML = p.sections.map(s => {
    let inner = '';
    if (s.body) {
      inner += `<div class="section-body">${s.body.split('\n\n').map(para => `<p>${para}</p>`).join('')}</div>`;
    }
    if (s.bullets) {
      inner += `<ul class="bullet-list">${s.bullets.map(b => `<li>${b}</li>`).join('')}</ul>`;
    }
    if (s.callout) {
      inner += `<div class="callout"><p>"${s.callout}"</p></div>`;
    }
    if (s.externalLink) {
      inner += `<a href="${s.externalLink.href}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:0.5rem;margin-top:1.5rem;font-family:var(--font-display);font-size:0.8rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--black);background:var(--accent);padding:0.8rem 1.6rem;text-decoration:none;">${s.externalLink.label}</a>`;
    }
    return `
      <div class="section">
        <div class="section-eyebrow">${s.eyebrow}</div>
        <h2 class="section-heading">${s.heading}</h2>
        ${inner}
      </div>`;
  }).join('');

  const toolsHTML = p.tools.map(t => `<span class="tool-chip">${t}</span>`).join('');
  const tagsHTML = p.tags.map(t => `<span class="tag">${t}</span>`).join('');

  const prevHTML = prev
    ? `<a href="project.html?p=${prev.id}" class="proj-nav-btn prev"><span class="proj-nav-direction">← Previous</span><span class="proj-nav-title">${prev.title}</span></a>`
    : `<div></div>`;
  const nextHTML = next
    ? `<a href="project.html?p=${next.id}" class="proj-nav-btn next"><span class="proj-nav-direction">Next →</span><span class="proj-nav-title">${next.title}</span></a>`
    : `<div></div>`;

  document.getElementById('page-root').innerHTML = `
    <div class="project-hero">
      <img src="${p.img}" alt="${p.title}" class="hero-img">
    </div>
    <div class="content">
      <div class="project-header">
        <a href="index.html#work" class="back-link">← Back to Work</a>
        <h1 class="project-title">${p.title}</h1>
        <div class="project-meta">
          <div class="tag-row">${tagsHTML}</div>
          <span class="meta-item"><strong>Role</strong> &nbsp;${p.role}</span>
          <span class="meta-item"><strong>Year</strong> &nbsp;${p.year}</span>
        </div>
        <div class="tools-row" style="margin-top:1.2rem">${toolsHTML}</div>
      </div>

      ${sectionsHTML}

      <div class="project-nav">
        ${prevHTML}
        ${nextHTML}
      </div>
    </div>
  `;
}

render();
</script>
